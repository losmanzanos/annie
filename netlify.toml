[build]
  publish = "."
  command = ""

# .html in the URL looks unfinished to a client. serve clean paths.
[[redirects]]
  from = "/reconnect"
  to = "/reconnect.html"
  status = 200
[[redirects]]
  from = "/journal"
  to = "/blog.html"
  status = 200
[[redirects]]
  from = "/journal/intellectualizing"
  to = "/blog-adaptation.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
